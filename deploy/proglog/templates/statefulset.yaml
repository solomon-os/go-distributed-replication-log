apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "proglog.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "proglog.labels" . | nindent 4 }}
  {{- if .Values.service.lb }}
  annotations:
    service-per-pod-label: "statefulset.kubernetes.io/pod-name"
    service-per-pod-ports: "{{ .Values.rpcPort }}:{{ .Values.rpcPort }}"
  {{- end }}
spec:
  selector:
    matchLabels:
{{- include "proglog.selectorLabels" . | nindent 6 }}
  serviceName: {{ include "proglog.fullname" . }}
  podManagementPolicy: Parallel
  replicas: {{ .Values.replicas }}
  template:
    metadata:
      name: {{ include "proglog.fullname" . }}
      labels:
{{- include "proglog.labels" . | nindent 8 }}
    spec:
      initContainers:
        - name: {{ include "proglog.fullname" . }}-config-init
          image: busybox
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              ID=$(echo $HOSTNAME | rev | cut -d- -f1 | rev)
              cat > /var/run/proglog/config.yaml <<EOD
              data-dir: /var/run/proglog/data
              rpc-port: {{ .Values.rpcPort }}
              bind-addr: "$HOSTNAME.proglog.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.serfPort }}"
              bootstrap: $([ $ID = 0 ] && echo true || echo false)
              acl-model-file: /etc/proglog/model.conf
              acl-policy-file: /etc/proglog/policy.csv
              EOD
              if [ $ID != 0 ]; then
                cat >> /var/run/proglog/config.yaml <<EOD
              start-join-addrs: "proglog-0.proglog.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.serfPort }}"
              EOD
              fi
          volumeMounts:
            - name: datadir
              mountPath: /var/run/proglog
      containers:
        - name: {{ include "proglog.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.rpcPort }}
              name: rpc
            - containerPort: {{ .Values.serfPort }}
              name: serf
          args:
            - --config-file=/var/run/proglog/config.yaml
          readinessProbe:
            exec:
              command: ["/bin/grpc_health_probe", "-addr=:{{ .Values.rpcPort }}"]
            initialDelaySeconds: 10
          livenessProbe:
            exec:
              command: ["/bin/grpc_health_probe", "-addr=:{{ .Values.rpcPort }}"]
            initialDelaySeconds: 10
          volumeMounts:
            - name: datadir
              mountPath: /var/run/proglog
  volumeClaimTemplates:
    - metadata:
        name: datadir
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.storage }}
